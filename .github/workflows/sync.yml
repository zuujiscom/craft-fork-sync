name: Sync forks

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the busy :00/:15/:30/:45 marks
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would move"
        type: boolean
        default: false

permissions:
  contents: write   # only for STATUS.md in this repo; the forks use SYNC_TOKEN

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Fast-forward forks to green upstream main
        uses: zuujiscom/green-fork-sync@v1
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          upstream-owner: storytold
          fork-owner: zuujiscom
          repos-file: repos.txt
          dry-run: ${{ inputs.dry_run && 'true' || 'false' }}
          status-file: STATUS.md
          ignore-events: schedule    # nightly jobs on main's tip shouldn't un-green a commit that passed on push
          # FreeBSD: 1.5-3 h jobs, usually cancelled by the next push. SonarCloud: storytold's own scans,
          # which the forks don't run (zuujiscom/craft-sonar scans them into our own organization).
          ignore-checks: "*FreeBSD*, *SonarCloud*"
          docs-paths: |               # commits touching only these get no CI; take them along
            *.md
            .coderabbit.yaml
            docs/*
            LICENSE*

      # storytold's SonarCloud workflows report to storytold's organization and need its token, so
      # they only fail here; zuujiscom/craft-sonar scans the forks instead. Switch off any that a
      # sync brought in.
      - name: Switch off storytold's SonarCloud workflows
        if: always() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          grep -v '^\s*\(#\|$\)' repos.txt | while read -r repo; do
            gh api "repos/zuujiscom/$repo/actions/workflows?per_page=100" \
              -q '.workflows[] | select(.state == "active" and (.path | test("sonar"; "i"))) | "\(.id) \(.path)"' |
            while read -r id path; do
              gh api -X PUT "repos/zuujiscom/$repo/actions/workflows/$id/disable" --silent \
                && echo "$repo: switched off $path" \
                || echo "::warning::$repo: couldn't switch off $path (SYNC_TOKEN needs Actions read and write)"
            done
          done

      - name: Commit status if it changed
        if: always() && !inputs.dry_run
        run: |
          git add STATUS.md
          git diff --cached --quiet && exit 0
          git -c user.name=zuujiscom -c user.email=zuujis@gmail.com commit -q -m "Update sync status"
          git push -q
